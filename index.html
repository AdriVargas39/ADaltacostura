<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#FDF8F3;--surface:#FFFFFF;--surface-muted:#F5EDE4;--surface-raised:#FFFFFF;
  --text-primary:#2C1810;--text-secondary:#6B5B4F;--text-tertiary:#A89484;--text-quaternary:#D4C4B0;
  --border:#E8DDD0;--accent:#C4785A;--positive:#16a34a;--warning:#f59e0b;--danger:#dc2626;
  --radius-sm:6px;--radius-md:10px;--radius-lg:12px;--radius-full:999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 4px 12px rgba(0,0,0,0.08);
  --transition:0.15s ease-out;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }
body { font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg) !important; color:var(--text-primary); }
#app { max-width:480px; margin:0 auto; height:100vh; height:100dvh; display:flex; flex-direction:column; position:relative; }

/* ===== APP HEADER (LOGO) ===== */
.app-header { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; position:sticky; top:0; z-index:60; }
.header-logo-btn { width:42px; height:42px; border-radius:50%; border:1px solid var(--border); background:var(--surface-muted); display:flex; align-items:center; justify-content:center; cursor:default; position:relative; padding:0; flex-shrink:0; transition:transform var(--transition); }
.header-logo-btn img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
.header-logo-btn svg { width:22px; height:22px; color:var(--text-tertiary); }
.header-logo-btn.admin { cursor:pointer; border-color:var(--text-quaternary); }
.header-logo-btn.admin:hover { transform:scale(1.05); }
.header-logo-btn.admin::after { content:'✎'; position:absolute; bottom:-2px; right:-2px; width:16px; height:16px; background:var(--text-primary); color:var(--surface); border-radius:50%; font-size:9px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); }
.header-title { font-size:15px; font-weight:600; }

/* ===== TAB BAR ===== */
.tab-bar { display:flex; gap:2px; padding:6px 8px 8px; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:50; flex-shrink:0; }
.tab-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; border:none; background:transparent; border-radius:var(--radius-md); cursor:pointer; color:var(--text-tertiary); font-size:11px; font-weight:500; transition:all var(--transition); position:relative; }
.tab-btn.active { color:var(--text-primary); background:var(--surface-muted); }
.tab-btn svg { width:22px; height:22px; stroke-width:1.8; }
.tab-logo-img { width:22px; height:22px; border-radius:50%; object-fit:cover; display:block; }
.badge { position:absolute; top:2px; right:6px; min-width:16px; height:16px; background:var(--text-primary); color:var(--surface); border-radius:var(--radius-full); font-size:10px; display:flex; align-items:center; justify-content:center; font-weight:600; padding:0 4px; }

/* ===== VIEWS ===== */
.views { flex:1; overflow-y:auto; overflow-x:hidden; position:relative; scroll-behavior:smooth; }
.view { display:none; padding:12px; min-height:100%; animation:fadeIn 0.2s ease-out; }
.view.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

/* ===== SEARCH & FILTERS ===== */
.search-box { display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:12px; background:var(--surface-muted); }
.search-box svg { color:var(--text-quaternary); flex-shrink:0; }
.search-box input { border:none; background:transparent; outline:none; width:100%; font-size:14px; color:var(--text-primary); font-family:inherit; }
.filters { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:14px; scrollbar-width:none; }
.filters::-webkit-scrollbar { display:none; }
.filter-chip { padding:7px 16px; border:1px solid var(--border); border-radius:var(--radius-full); background:var(--surface); font-size:13px; cursor:pointer; white-space:nowrap; color:var(--text-secondary); font-weight:500; transition:all var(--transition); }
.filter-chip.active { background:var(--text-primary); color:var(--surface); border-color:var(--text-primary); }

/* ===== PRODUCT GRID ===== */
.product-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.product-card { border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; background:var(--surface); cursor:pointer; transition:transform var(--transition), box-shadow var(--transition); box-shadow:var(--shadow-sm); display:flex; flex-direction:column; position:relative; }
.product-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
.product-img { height:170px; display:flex; align-items:center; justify-content:center; font-size:56px; position:relative; background:var(--surface-muted); }
.product-img img { width:100%; height:100%; object-fit:cover; }
.product-info { padding:12px; flex:1; display:flex; flex-direction:column; }
.product-name { font-size:14px; font-weight:600; margin-bottom:4px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.product-details-text { font-size:11px; color:var(--text-secondary); margin-bottom:4px; }
.product-price { font-size:17px; font-weight:700; margin-top:auto; }
.product-actions { display:flex; gap:6px; margin-top:10px; }
.btn-sm { flex:1; padding:7px 8px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); font-size:12px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; color:var(--text-secondary); transition:all var(--transition); }
.btn-sm:hover { background:var(--surface-muted); }
.out-of-stock-overlay { position:absolute; inset:0; background:rgba(255,255,255,0.85); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--danger); font-size:14px; text-align:center; padding:10px; z-index:2; }
.stock-warning-badge { background:#fef3c7; color:#d97706; font-size:10px; padding:2px 6px; border-radius:var(--radius-full); font-weight:600; display:inline-block; margin-bottom:4px; }

/* ===== CART ===== */
.cart-item { display:flex; gap:14px; padding:14px; border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:10px; background:var(--surface); box-shadow:var(--shadow-sm); }
.cart-img { width:76px; height:76px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; font-size:32px; flex-shrink:0; background:var(--surface-muted); overflow:hidden; }
.cart-img img { width:100%; height:100%; object-fit:cover; }
.cart-details { flex:1; min-width:0; }
.cart-name { font-size:14px; font-weight:600; margin-bottom:2px; }
.cart-price { font-size:15px; font-weight:700; }
.qty-controls { display:flex; align-items:center; gap:8px; margin-top:8px; }
.qty-btn { width:30px; height:30px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; line-height:1; color:var(--text-primary); }
.qty-btn:active { background:var(--surface-muted); }
.qty-val { font-size:14px; font-weight:600; min-width:20px; text-align:center; }
.cart-remove { margin-left:auto; background:transparent; border:none; cursor:pointer; font-size:16px; }
.empty-state { text-align:center; padding:50px 24px; color:var(--text-quaternary); }
.empty-state p { font-size:15px; font-weight:500; color:var(--text-secondary); }
.total-bar { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-top:1px solid var(--border); margin-top:12px; }
.total-value { font-size:22px; font-weight:700; }
.whatsapp-btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:14px; border:none; border-radius:var(--radius-md); background:var(--positive); color:#fff; font-size:15px; font-weight:600; cursor:pointer; margin-top:16px; box-shadow:0 2px 8px rgba(22,163,74,0.25); }

/* ===== ORDERS & ADMIN ===== */
.admin-toggle { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--surface-muted); border-radius:var(--radius-md); margin-bottom:14px; font-size:13px; cursor:pointer; border:1px solid var(--border); font-weight:500; }
.order-card { padding:14px; border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:10px; background:var(--surface); box-shadow:var(--shadow-sm); }
.order-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.order-status { padding:3px 10px; border-radius:var(--radius-full); font-size:11px; font-weight:600; }
.status-Pendiente { background:#fef3c7; color:#d97706; }
.status-Enviado { background:#dbeafe; color:#2563eb; }
.status-Entregado { background:#dcfce3; color:#16a34a; }
.order-actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }

/* ===== CHAT ===== */
.chat-container { display:flex; flex-direction:column; height:calc(100vh - 200px); min-height:320px; border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; background:var(--surface); }
.chat-messages { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
.chat-bubble { max-width:82%; padding:10px 14px; border-radius:16px; font-size:13.5px; line-height:1.45; word-wrap:break-word; }
.chat-bubble.client { align-self:flex-end; background:var(--text-primary); color:var(--surface); border-bottom-right-radius:4px; }
.chat-bubble.admin { align-self:flex-start; background:var(--surface-muted); color:var(--text-primary); border-bottom-left-radius:4px; border:1px solid var(--border); }
.chat-input-area { display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--border); background:var(--surface); }
.chat-input { flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface-muted); outline:none; font-size:14px; }
.chat-send { width:40px; height:40px; border:none; border-radius:var(--radius-md); background:var(--text-primary); color:var(--surface); cursor:pointer; display:flex; align-items:center; justify-content:center; }

/* ===== PASSWORD TOGGLE ===== */
.password-wrap { position:relative; margin-bottom:12px; }
.password-wrap .form-input { margin-bottom:0; padding-right:44px; }
.password-toggle { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:32px; height:32px; border:none; background:transparent; cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center; color:var(--text-tertiary); border-radius:var(--radius-sm); }
.password-toggle:hover { background:var(--surface-muted); }

/* ===== MODAL & FORMS ===== */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:flex-end; justify-content:center; z-index:100; }
.modal-overlay.active { display:flex; }
.modal { background:var(--surface); border-radius:var(--radius-lg) var(--radius-lg) 0 0; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; padding:20px; }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; position:sticky; top:0; background:var(--surface); z-index:5; padding-bottom:10px;}
.modal-close { width:36px; height:36px; border:none; border-radius:var(--radius-md); background:var(--surface-muted); cursor:pointer; }
.form-input { width:100%; padding:12px; border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:12px; font-size:14px; background:var(--surface-muted); outline:none; }
.btn-full { width:100%; padding:14px; border:none; border-radius:var(--radius-md); background:var(--text-primary); color:var(--surface); font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--text-primary); color:var(--surface); padding:10px 20px; border-radius:var(--radius-md); font-size:13px; opacity:0; pointer-events:none; transition:opacity 0.3s; z-index:200; }
.toast.show { opacity:1; }
.chat-list-item { padding:12px; border-bottom:1px solid var(--border); cursor:pointer; font-weight:500; font-size:14px;}
.chat-list-item:hover { background:var(--surface-muted); }
</style>

<body>

<div id="app">
  <!-- APP HEADER: LOGO (solo el admin puede pincharlo para cambiarlo) -->
  <div class="app-header">
    <button id="headerLogoBtn" class="header-logo-btn" onclick="handleLogoClick()" title="Logo de la tienda">
      <img id="headerLogoImg" src="" alt="Logo" style="display:none;">
      <svg id="headerLogoSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    </button>
  </div>

  <!-- TAB BAR -->
  <div class="tab-bar">
    <button class="tab-btn active" data-view="catalogo" onclick="switchView('catalogo')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Catálogo</span>
    </button>
    <button class="tab-btn" data-view="carrito" onclick="switchView('carrito')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      <span style="position:relative">Carrito<span id="cartBadge" class="badge" style="display:none">0</span></span>
    </button>
    <button class="tab-btn" data-view="pedidos" onclick="switchView('pedidos')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg>
      <span>Pedidos</span>
    </button>
    <button class="tab-btn" data-view="chat" onclick="switchView('chat')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      <span>Chat</span>
    </button>
  </div>

  <div class="views">
    <!-- CATÁLOGO -->
    <div id="catalogo" class="view active">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

        <button class="filter-chip active" data-filter="all" onclick="setCategory('all')">Todo</button>

      </div>
      <div id="productGrid" class="product-grid">Cargando catálogo...</div>
    </div>

    <!-- CARRITO -->
    <div id="carrito" class="view">
      <div id="cartItems"></div>
      <div id="cartEmpty" class="empty-state">
        <p>Tu carrito está vacío</p>
      </div>
      <div id="cartSummary" style="display:none">
        <input type="text" id="orderName" class="form-input" placeholder="Tu nombre completo">
        <input type="tel" id="orderPhone" class="form-input" placeholder="Tu número de celular">
        <div class="total-bar">
          <span class="total-label">Total a pagar</span>
          <span class="total-value" id="cartTotal">$0</span>
        </div>
        <button class="whatsapp-btn" onclick="sendWhatsAppOrder()">Pedir por WhatsApp</button>
      </div>
    </div>

    <div id="chat" class="view">

        <h3 style="margin-bottom:10px;">Chats de Clientes</h3>
        <div id="adminChatList"></div>
      </div>
      <div class="chat-container" id="chatRoomView">

      </div>
    </div>

  <!-- MODALS -->

  <div id="loginModal" class="modal-overlay" onclick="closeModals(event)">

        <span class="modal-title">Admin Login</span>
        <button class="modal-close" onclick="closeModals()">✕</button>
      </div>
      <input type="email" id="adminEmail" class="form-input" placeholder="Correo">

        <button type="button" class="password-toggle" id="passToggleBtn" onclick="togglePassword()" title="Mostrar contraseña">👁️</button>
      </div>
      <button class="btn-full" onclick="loginAdmin()">Ingresar</button>
      <button class="btn-full" style="background:#dc2626; margin-top:10px; display:none;" id="logoutBtn" onclick="logoutAdmin()">Cerrar Sesión</button>

  </div>

    <div class="modal" onclick="event.stopPropagation()">

        <button class="modal-close" onclick="closeModals()">✕</button>
      </div>

      <input type="text" id="newProdName" class="form-input" placeholder="Nombre de la prenda">
      <input type="number" id="newProdPrice" class="form-input" placeholder="Precio ($)">
      <input type="text" id="newProdCat" class="form-input" placeholder="Categoría (ej: Vestidos, Zapatos)">
      <input type="text" id="newProdSize" class="form-input" placeholder="Talla(s) (ej: S, M, L o Única)">
      <input type="text" id="newProdColors" class="form-input" placeholder="Color(es) (ej: Rojo, Negro, Azul)">
      <div style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label style="font-size:12px; margin-bottom:3px; display:block;">Stock actual:</label>
          <input type="number" id="newProdStock" class="form-input" placeholder="Cantidad" value="10">
        </div>
        <div style="flex:1;">
          <label style="font-size:12px; margin-bottom:3px; display:block;">Stock mínimo de alerta:</label>
          <input type="number" id="newProdMinStock" class="form-input" placeholder="Mínimo" value="3">
        </div>
      </div>
      <label style="font-size:12px; margin-bottom:5px; display:block;">Selecciona una foto (Galería o Archivos):</label>
      <input type="file" id="newProdImg" class="form-input">
      <button class="btn-full" onclick="saveProduct()">Guardar Producto</button>
    </div>
  </div>

  <!-- Logo Modal -->
  <div id="logoModal" class="modal-overlay" onclick="closeModals(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span class="modal-title">Cambiar Logo de la Tienda</span>
        <button class="modal-close" onclick="closeModals()">✕</button>
      </div>
      <label style="font-size:12px; margin-bottom:5px; display:block;">Selecciona la imagen para el logo:</label>
      <input type="file" id="newLogoImg" class="form-input">
      <button class="btn-full" onclick="saveLogo()">Guardar Logo</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
</div>

// Variables Globales
const whatsappNumber = "51999999999"; 
const FALLBACK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="100%" height="100%" fill="#F5EDE4"/><text x="50%" y="50%" font-family="sans-serif" font-size="16" fill="#A89484" text-anchor="middle" dominant-baseline="middle">Sin imagen</text></svg>`
);
let clientId = null;
let cart = JSON.parse(localStorage.getItem('tienda_cart') || '[]');
let allProducts = [];
let isAdmin = false;
let currentCategory = 'all';
let currentSearch = '';
let activeAdminChatUser = null;

// Autenticación
auth.onAuthStateChanged(user => {
  // Si nadie ha iniciado sesión todavía, autenticamos al cliente de forma anónima
  // (esto le da un UID real y verificable por Firebase, en vez de uno inventado).
  if (!user) {
    auth.signInAnonymously().catch(err => {
      console.error('Error de autenticación:', err);
      alert('No se pudo iniciar la app: ' + err.message + '\n\nRevisa que el proveedor "Anonymous" esté activado en Firebase → Authentication → Sign-in method.');
    });
    return; // este mismo listener se volverá a disparar cuando el login anónimo termine
  }

  isAdmin = !user.isAnonymous;
  clientId = user.uid;

  document.getElementById('adminLabel').textContent = isAdmin ? 'Modo vendedora (Activo)' : 'Modo cliente';
  document.getElementById('headerLogoBtn').classList.toggle('admin', isAdmin);
  document.getElementById('adminControlsArea').style.display = isAdmin ? 'block' : 'none';
  document.getElementById('logoutBtn').style.display = isAdmin ? 'block' : 'none';
  
  if(isAdmin) {
    document.getElementById('adminChatListView').style.display = 'block';
    document.getElementById('chatRoomView').style.display = 'none';
    loadAdminChats();
  } else {
    document.getElementById('adminChatListView').style.display = 'none';
    document.getElementById('chatRoomView').style.display = 'flex';
    loadClientChat();
  }
  
  loadLogo();
  loadProducts();
  loadOrders();
});

function openLoginModal() { document.getElementById('loginModal').classList.add('active'); }
function openLogoModal() { 
  document.getElementById('newLogoImg').value = '';
  document.getElementById('logoModal').classList.add('active'); 
}
function closeModals(e) { 
  if(!e || e.target.classList.contains('modal-overlay') || e.target.classList.contains('modal-close')) {
    document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); 
  }
}

function togglePassword() {
  const input = document.getElementById('adminPass');
  const btn = document.getElementById('passToggleBtn');
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  btn.textContent = isHidden ? '🙈' : '👁️';
  btn.title = isHidden ? 'Ocultar contraseña' : 'Mostrar contraseña';
}

function loginAdmin() {
  const email = document.getElementById('adminEmail').value;
  const pass = document.getElementById('adminPass').value;
  auth.signInWithEmailAndPassword(email, pass).then(() => {
    closeModals(); showToast('¡Bienvenida Administradora!');
  }).catch(e => alert("Error: " + e.message));
}
function logoutAdmin() { auth.signOut(); closeModals(); showToast('Sesión cerrada'); }

// 2. LOGO
function loadLogo() {
  db.collection('config').doc('store').get().then(doc => {
    const logoImg = document.getElementById('headerLogoImg');
    const logoSvg = document.getElementById('headerLogoSvg');
    if(doc.exists && doc.data().logoUrl) {
      logoImg.src = doc.data().logoUrl;
      logoImg.style.display = 'block';
      logoSvg.style.display = 'none';
    } else {
      logoImg.style.display = 'none';
      logoSvg.style.display = 'block';
    }
  }).catch(() => {});
}

// Pinchar el logo solo abre el cambio de logo si eres administradora
function handleLogoClick() {
  if(isAdmin) {
    openLogoModal();
  } else {
    showToast('Solo la administradora puede cambiar el logo');
  }
}

function saveLogo() {
  const file = document.getElementById('newLogoImg').files[0];
  if(!file) return alert("Selecciona una imagen para el logo");

  closeModals();
  showToast('Subiendo logo...');

  const ref = storage.ref(`logo/store_logo_${Date.now()}`);
  ref.put(file).then(snap => snap.ref.getDownloadURL()).then(url => {
    return db.collection('config').doc('store').set({ logoUrl: url }, { merge: true });
  }).then(() => {
    document.getElementById('newLogoImg').value = '';
    loadLogo();
    showToast('¡Logo actualizado con éxito!');
  }).catch(err => alert("Error al subir logo: " + err.message));
}

// 3. PRODUCTOS
function loadProducts() {
  db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snap => {
    allProducts = [];
    snap.forEach(doc => allProducts.push({ id: doc.id, ...doc.data() }));
    renderCategories();
    renderProducts();
  }, err => {
    console.error('Error cargando productos:', err);
    document.getElementById('productGrid').innerHTML =
      `<div class="empty-state" style="grid-column:1/-1">No se pudo cargar el catálogo.<br><small>${escapeHtml(err.message)}</small></div>`;
  });
}

function renderCategories() {
  const container = document.getElementById('categoryFilters');
  const categories = [...new Set(allProducts.map(p => p.category ? p.category.toLowerCase().trim() : ''))].filter(Boolean);
  
  let html = `<button class="filter-chip ${currentCategory === 'all' ? 'active' : ''}" data-filter="all" onclick="setCategory('all')">Todo</button>`;
  
  categories.forEach(cat => {
    const formattedCat = cat.charAt(0).toUpperCase() + cat.slice(1);
    const isActive = currentCategory === cat ? 'active' : '';
    html += `<button class="filter-chip ${isActive}" data-filter="${cat}" onclick="setCategory('${cat}')">${formattedCat}</button>`;
  });
  
  container.innerHTML = html;
}

function renderProducts() {
  const grid = document.getElementById('productGrid');
  let filtered = allProducts.filter(p => {
    const matchCat = currentCategory === 'all' || (p.category && p.category.toLowerCase().trim() === currentCategory);
    const matchSearch = p.name.toLowerCase().includes(currentSearch.toLowerCase());
    return matchCat && matchSearch;
  });

  grid.innerHTML = filtered.map(p => {
    const stock = Number(p.stock ?? 10);
    const minStock = Number(p.minStock ?? 2);
    const isOut = stock <= 0;

    let warningBadge = '';
    if(isAdmin && !isOut && stock <= minStock) {
      warningBadge = `<div class="stock-warning-badge">⚠️ Stock bajo (${stock} restantes)</div>`;
    }

    const outOverlay = isOut ? `<div class="out-of-stock-overlay">No disponible</div>` : '';
    const addBtn = isOut ? '' : `<button class="btn-sm" style="background:var(--text-primary); color:white;" onclick="addToCart('${p.id}')">Agregar</button>`;

    const adminControls = isAdmin ? `
      <div style="display:flex; gap:5px; margin-top:5px;">
        <button class="btn-sm" style="background:var(--surface-muted);" onclick="openEditModal('${p.id}')">✏️ Editar</button>
        <button class="btn-sm" style="background:#dc2626; color:#fff;" onclick="deleteProduct('${p.id}')">🗑️ Borrar</button>
      </div>
    ` : '';
    
    return `
    <div class="product-card">
      ${outOverlay}
      <div class="product-img"><img src="${p.image || FALLBACK_IMG}" alt="${escapeHtml(p.name)}" onerror="this.onerror=null;this.src='${FALLBACK_IMG}';"></div>
      <div class="product-info">
        <div class="product-name">${escapeHtml(p.name)}</div>
        <div class="product-details-text">Talla: ${escapeHtml(p.size || 'Única')} | Color: ${escapeHtml(p.colors || 'Varios')}</div>
        <div class="product-details-text">Stock: ${stock}</div>
        ${warningBadge}
        <div class="product-price">$${p.price}</div>
        <div class="product-actions">
          ${addBtn}
        </div>
        ${adminControls}
      </div>
    </div>`;
  }).join('');
}

function setCategory(cat) {
  currentCategory = cat;
  renderCategories();
  renderProducts();
}
function filterProducts() { currentSearch = document.getElementById('searchInput').value; renderProducts(); }

function openAddModal() {
  document.getElementById('modalProductTitle').textContent = 'Subir Prenda';
  document.getElementById('editProdId').value = '';
  document.getElementById('newProdName').value = '';
  document.getElementById('newProdPrice').value = '';
  document.getElementById('newProdCat').value = '';
  document.getElementById('newProdSize').value = '';
  document.getElementById('newProdColors').value = '';
  document.getElementById('newProdStock').value = '10';
  document.getElementById('newProdMinStock').value = '3';
  document.getElementById('newProdImg').value = '';
  document.getElementById('addProductModal').classList.add('active');
}

function openEditModal(id) {
  const p = allProducts.find(x => x.id === id);
  if(!p) return;
  document.getElementById('modalProductTitle').textContent = 'Editar Prenda';
  document.getElementById('editProdId').value = p.id;
  document.getElementById('newProdName').value = p.name || '';
  document.getElementById('newProdPrice').value = p.price || '';
  document.getElementById('newProdCat').value = p.category || '';
  document.getElementById('newProdSize').value = p.size || '';
  document.getElementById('newProdColors').value = p.colors || '';
  document.getElementById('newProdStock').value = p.stock ?? 10;
  document.getElementById('newProdMinStock').value = p.minStock ?? 3;
  document.getElementById('newProdImg').value = '';
  document.getElementById('addProductModal').classList.add('active');
}

function saveProduct() {
  const editId = document.getElementById('editProdId').value;
  const name = document.getElementById('newProdName').value;
  const price = document.getElementById('newProdPrice').value;
  const cat = document.getElementById('newProdCat').value.trim();
  const size = document.getElementById('newProdSize').value.trim();
  const colors = document.getElementById('newProdColors').value.trim();
  const stock = document.getElementById('newProdStock').value;
  const minStock = document.getElementById('newProdMinStock').value;
  const file = document.getElementById('newProdImg').files[0];

  if(!name || !price || !cat) return alert("Completa al menos el nombre, precio y categoría");
  if(!editId && !file) return alert("Selecciona una foto para el nuevo producto");

  closeModals();
  showToast(editId ? 'Actualizando producto...' : 'Subiendo producto...');

  const saveData = (imageUrl) => {
    const dataObj = {
      name, 
      price: Number(price), 
      category: cat, 
      size: size || 'Única', 
      colors: colors || 'Único', 
      stock: Number(stock || 10), 
      minStock: Number(minStock || 3)
    };
    if(imageUrl) dataObj.image = imageUrl;

    let promise;
    if(editId) {
      promise = db.collection('products').doc(editId).update(dataObj);
    } else {
      dataObj.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      promise = db.collection('products').add(dataObj);
    }

    promise.then(() => {
      showToast(editId ? '¡Producto actualizado!' : '¡Producto agregado con éxito!');
    }).catch(err => alert("Error: " + err.message));
  };

  if(file) {
    const ref = storage.ref(`products/${Date.now()}_${file.name}`);
    ref.put(file).then(snap => snap.ref.getDownloadURL()).then(url => {
      saveData(url);
    }).catch(err => alert("Error al subir imagen: " + err.message));
  } else {
    saveData(null);
  }
}

function deleteProduct(id) {
  if(confirm("¿Seguro que deseas eliminar esta prenda?")) {
    db.collection('products').doc(id).delete().then(() => {
      showToast('Producto eliminado');
    });
  }
}

// 4. CARRITO Y PEDIDOS
function addToCart(id) {
  const p = allProducts.find(x => x.id === id);
  if(!p || (p.stock ?? 10) <= 0) return alert("Este producto ya no está disponible");

  const existing = cart.find(item => item.id === id);
  const currentQtyInCart = existing ? existing.qty : 0;

  if(currentQtyInCart + 1 > p.stock) {
    return alert("No hay más stock disponible para este producto");
  }

  if(existing) existing.qty++; 
  else cart.push({id, qty:1, name: p.name, price: p.price, image: p.image});
  saveCart(); renderCart(); showToast('Añadido al carrito');
}

function saveCart() { localStorage.setItem('tienda_cart', JSON.stringify(cart)); updateCartBadge(); }
function updateCartBadge() { 
  const count = cart.reduce((s,i) => s + i.qty, 0); 
  document.getElementById('cartBadge').style.display = count > 0 ? 'flex' : 'none';
  document.getElementById('cartBadge').innerText = count;
}

function renderCart() {
  const container = document.getElementById('cartItems');
  if(cart.length === 0) {
    container.innerHTML = ''; document.getElementById('cartEmpty').style.display = 'block'; document.getElementById('cartSummary').style.display = 'none'; return;
  }
  document.getElementById('cartEmpty').style.display = 'none'; document.getElementById('cartSummary').style.display = 'block';
  
  let total = 0;
  container.innerHTML = cart.map((item, index) => {
    total += item.price * item.qty;
    return `
      <div class="cart-item">
        <div class="cart-img"><img src="${item.image}" onerror="this.onerror=null;this.src='${FALLBACK_IMG}';"></div>
        <div class="cart-details">
          <div class="cart-name">${escapeHtml(item.name)}</div>
          <div class="cart-price">$${item.price * item.qty}</div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
            <span class="qty-val">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
            <button class="cart-remove" onclick="removeCart(${index})">🗑</button>
          </div>
        </div>
      </div>`;
  }).join('');
  document.getElementById('cartTotal').innerText = '$' + total;
}

function changeQty(index, delta) {
  const item = cart[index];
  if(!item) return;
  const product = allProducts.find(p => p.id === item.id);
  const stock = product ? Number(product.stock ?? 10) : Infinity;
  const newQty = item.qty + delta;
  if(newQty < 1) return removeCart(index);
  if(newQty > stock) return showToast('No hay más stock disponible');
  item.qty = newQty;
  saveCart(); renderCart();
}

function removeCart(index) { cart.splice(index, 1); saveCart(); renderCart(); }

function sendWhatsAppOrder() {
  const name = document.getElementById('orderName').value;
  const phone = document.getElementById('orderPhone').value;
  if(!name || !phone) return alert("Por favor ingresa tu nombre y celular");

  let total = 0;
  let text = `¡Hola! Soy ${name}. Quiero hacer un pedido:\n\n`;
  cart.forEach(item => {
    text += `• ${item.name} (x${item.qty}) = $${item.price * item.qty}\n`;
    total += item.price * item.qty;
  });
  text += `\nTotal: $${total}\nMi celular es: ${phone}`;

  const batch = db.batch();
  cart.forEach(item => {
    const prodRef = db.collection('products').doc(item.id);
    const originalProd = allProducts.find(p => p.id === item.id);
    if(originalProd) {
      const newStock = Math.max(0, (originalProd.stock || 10) - item.qty);
      batch.update(prodRef, { stock: newStock });
    }
  });

  batch.commit().then(() => {
    return db.collection('orders').add({
      clientId, customerName: name, phone, items: cart, total, status: 'Pendiente', createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }).then(() => {
    cart = []; saveCart(); renderCart(); switchView('pedidos');
    window.open('https://wa.me/' + whatsappNumber + '?text=' + encodeURIComponent(text), '_blank');
  }).catch(err => {
    alert("Error al procesar el pedido: " + err.message);
  });
}

function loadOrders() {
  let query = isAdmin ? db.collection('orders') : db.collection('orders').where('clientId', '==', clientId);
  query.orderBy('createdAt', 'desc').onSnapshot(snap => {
    const list = document.getElementById('ordersList');
    list.innerHTML = snap.empty ? '<div class="empty-state">No hay pedidos</div>' : '';
    
    snap.forEach(doc => {
      const o = doc.data();
      const adminBtns = isAdmin ? `
        <div class="order-actions">
          <button class="btn-sm" onclick="changeStatus('${doc.id}', 'Enviado')">📦 Enviar</button>
          <button class="btn-sm" onclick="changeStatus('${doc.id}', 'Entregado')">✅ Entregar</button>
        </div>` : '';

      list.innerHTML += `
        <div class="order-card">
          <div class="order-header">
            <strong>${escapeHtml(o.customerName)}</strong>
            <span class="order-status status-${o.status}">${escapeHtml(o.status)}</span>
          </div>
          <p style="font-size:13px; color:var(--text-secondary)">${o.items.map(i=>`${escapeHtml(i.name)} (x${i.qty})`).join(', ')}</p>
          <p><strong>Total: $${o.total}</strong></p>
          ${adminBtns}
        </div>`;
    });
  }, err => {
    console.error('Error cargando pedidos:', err);
    document.getElementById('ordersList').innerHTML =
      `<div class="empty-state">No se pudieron cargar los pedidos.<br><small>${escapeHtml(err.message)}</small></div>`;
  });
}

function changeStatus(id, status) { db.collection('orders').doc(id).update({status}); }

// 5. CHAT
function loadClientChat() {
  db.collection('chats').doc(clientId).collection('messages').orderBy('timestamp', 'asc').onSnapshot(snap => {
    const box = document.getElementById('chatMessages');
    box.innerHTML = '';
    snap.forEach(doc => {
      const msg = doc.data();
      box.innerHTML += `<div class="chat-bubble ${msg.sender}">${escapeHtml(msg.text)}</div>`;
    });
    box.scrollTop = box.scrollHeight;
  }, err => console.error('Error cargando chat:', err));
}

function loadAdminChats() {
  db.collection('chats').orderBy('lastUpdated', 'desc').onSnapshot(snap => {
    const list = document.getElementById('adminChatList');
    list.innerHTML = '';
    snap.forEach(doc => {
      list.innerHTML += `<div class="chat-list-item" onclick="openAdminChat('${doc.id}')">Chat con Cliente: ${escapeHtml(doc.id.slice(0, 8))}</div>`;
    });
  }, err => console.error('Error cargando lista de chats:', err));
}

function openAdminChat(id) {
  activeAdminChatUser = id;
  document.getElementById('adminChatListView').style.display = 'none';
  document.getElementById('chatRoomView').style.display = 'flex';
  
  db.collection('chats').doc(id).collection('messages').orderBy('timestamp', 'asc').onSnapshot(snap => {
    const box = document.getElementById('chatMessages');
    box.innerHTML = `<button class="btn-sm" style="margin-bottom:10px" onclick="backToChatList()">🔙 Volver a la lista</button>`;
    snap.forEach(doc => {
      const msg = doc.data();
      box.innerHTML += `<div class="chat-bubble ${msg.sender === 'admin' ? 'client' : 'admin'}">${escapeHtml(msg.text)}</div>`;
    });
    box.scrollTop = box.scrollHeight;
  });
}

function backToChatList() {
  activeAdminChatUser = null;
  document.getElementById('adminChatListView').style.display = 'block';
  document.getElementById('chatRoomView').style.display = 'none';
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;

  const targetId = isAdmin ? activeAdminChatUser : clientId;
  const senderType = isAdmin ? 'admin' : 'client';

  if(!targetId) return;

  db.collection('chats').doc(targetId).collection('messages').add({
    text, sender: senderType, timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });
  
  db.collection('chats').doc(targetId).set({ lastUpdated: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true});
  input.value = '';
}

// Utils
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function switchView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(view).classList.add('active');
  document.querySelector(`[data-view="${view}"]`).classList.add('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

renderCart();
updateCartBadge();
</script>
