<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AD Alta Costura - Tienda</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <header class="navbar">
    <h1>AD Alta Costura</h1>
    <div class="cart-icon" onclick="toggleCart()">🛒 <span id="cart-count">0</span></div>
  </header>

  <main class="container">
    <h2>Nuestra Colección</h2>
    <div id="product-grid" class="grid">
      <p>Cargando productos...</p>
    </div>
  </main>

  <div id="cart-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="toggleCart()">&times;</span>
      <h3>Tu Carrito</h3>
      <div id="cart-items"></div>
      <h4>Total: $<span id="cart-total">0</span></h4>
      
      <div class="form-group">
        <label>Nombre Completo:</label>
        <input type="text" id="cust-name" placeholder="Tu nombre">
      </div>
      <div class="form-group">
        <label>Teléfono / WhatsApp:</label>
        <input type="tel" id="cust-phone" placeholder="Ej: +57 300 000 0000">
      </div>
      <button class="btn btn-primary" onclick="sendOrder()">Confirmar Pedido</button>
    </div>
  </div>

  <div class="chat-widget">
    <button class="chat-btn" onclick="toggleChat()">💬 Chat</button>
    <div id="chat-box" class="chat-box hidden">
      <div class="chat-header">
        <span>Atención al Cliente</span>
        <button onclick="toggleChat()">&times;</button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Escribe tu mensaje...">
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    // Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBtkpwXWWJUDDab3RLuzxS7oAOmFv-LpG8",
      authDomain: "adrivargas-f9558.firebaseapp.com",
      projectId: "adrivargas-f9558",
      storageBucket: "adrivargas-f9558.firebasestorage.app",
      messagingSenderId: "831196414635",
      appId: "1:831196414635:web:63c469d105337a7b976dee"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let cart = [];
    let userChatId = localStorage.getItem('ad_chat_id') || 'user_' + Date.now();
    localStorage.setItem('ad_chat_id', userChatId);

    // Cargar Productos
    db.collection("products").onSnapshot(snapshot => {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = "";
      if(snapshot.empty) {
        grid.innerHTML = "<p>No hay productos disponibles por el momento.</p>";
        return;
      }
      snapshot.forEach(doc => {
        const p = doc.data();
        grid.innerHTML += `
          <div class="card">
            <img src="${p.imageUrl}" alt="${p.name}">
            <div class="card-body">
              <h3>${p.name}</h3>
              <p class="price">$${p.price}</p>
              <button class="btn btn-secondary" onclick="addToCart('${doc.id}', '${p.name}', ${p.price})">Añadir al Carrito</button>
            </div>
          </div>
        `;
      });
    });

    // Carrito
    function addToCart(id, name, price) {
      cart.push({id, name, price});
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById("cart-count").innerText = cart.length;
      const itemsContainer = document.getElementById("cart-items");
      itemsContainer.innerHTML = "";
      let total = 0;
      cart.forEach((item, index) => {
        total += Number(item.price);
        itemsContainer.innerHTML += `<p>${item.name} - $${item.price} <button onclick="removeFromCart(${index})">❌</button></p>`;
      });
      document.getElementById("cart-total").innerText = total;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function toggleCart() {
      document.getElementById("cart-modal").classList.toggle("active");
    }

    function sendOrder() {
      const name = document.getElementById("cust-name").value;
      const phone = document.getElementById("cust-phone").value;

      if(!name || !phone || cart.length === 0) {
        alert("Por favor completa tus datos y añade productos al carrito.");
        return;
      }

      const orderData = {
        customerName: name,
        phone: phone,
        items: cart,
        total: cart.reduce((sum, item) => sum + Number(item.price), 0),
        status: "Pendiente",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection("orders").add(orderData).then(() => {
        alert("¡Pedido realizado con éxito! Nos pondremos en contacto contigo.");
        cart = [];
        updateCartUI();
        toggleCart();
      });
    }

    // Chat
    function toggleChat() {
      document.getElementById("chat-box").classList.toggle("hidden");
    }

    function sendMessage() {
      const text = document.getElementById("chat-input").value;
      if(!text) return;

      db.collection("chats").doc(userChatId).collection("messages").add({
        sender: "client",
        text: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      db.collection("chats").doc(userChatId).set({
        lastMessage: text,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });

      document.getElementById("chat-input").value = "";
    }

    // Escuchar mensajes del chat
    db.collection("chats").doc(userChatId).collection("messages").orderBy("timestamp", "asc")
      .onSnapshot(snapshot => {
        const box = document.getElementById("chat-messages");
        box.innerHTML = "";
        snapshot.forEach(doc => {
          const msg = doc.data();
          box.innerHTML += `<div class="msg ${msg.sender}">${msg.text}</div>`;
        });
        box.scrollTop = box.scrollHeight;
      });
  </script>
</body>
</html>
